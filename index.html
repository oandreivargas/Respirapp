<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Respira">
<meta name="theme-color" content="#0a0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Exercício guiado de respiração para regulação do sistema nervoso">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Respira</title>
<style>
  :root {
    --bg: #0a0f1a;
    --bg-card: rgba(255,255,255,0.04);
    --ball-start: #4fc3f7;
    --ball-end: #1565c0;
    --glow: rgba(79, 195, 247, 0.35);
    --glow-dim: rgba(21, 101, 192, 0.12);
    --text: #e0e6ed;
    --text-dim: #5a6e85;
    --accent: #80cbc4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(var(--safe-top) + 1rem) 1.5rem calc(var(--safe-bottom) + 1rem);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
  .screen.active { display: flex; }

  #homeScreen { gap: 2.5rem; justify-content: center; min-height: 80dvh; }

  .brand { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .brand-icon { font-size: 2.8rem; }
  .brand-name { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.02em; }
  .brand-sub { font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0.06em; }

  .protocol-cards { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }

  .protocol-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 1.3rem; background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 1rem;
    cursor: pointer; transition: background 0.2s, border-color 0.2s;
  }
  .protocol-card:active { background: rgba(255,255,255,0.08); border-color: rgba(128,203,196,0.3); }
  .protocol-card .left { display: flex; flex-direction: column; gap: 0.15rem; }
  .protocol-card .title { font-size: 1.05rem; font-weight: 500; }
  .protocol-card .desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; }
  .protocol-card .arrow { color: var(--text-dim); font-size: 1.2rem; }

  #exerciseScreen { justify-content: space-between; min-height: 90dvh; padding-top: 1rem; padding-bottom: 1.5rem; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .back-btn { background: none; border: none; color: var(--text-dim); font-size: 0.9rem; cursor: pointer; padding: 0.5rem; display: flex; align-items: center; gap: 0.3rem; }
  .protocol-badge { font-size: 0.78rem; color: var(--text-dim); background: var(--bg-card); padding: 0.35rem 0.8rem; border-radius: 1rem; }

  .exercise-center { display: flex; flex-direction: column; align-items: center; gap: 1.8rem; flex: 1; justify-content: center; }

  .phase-text { font-size: 1.4rem; font-weight: 300; letter-spacing: 0.12em; min-height: 2rem; text-align: center; transition: opacity 0.3s; }

  .ball-container { position: relative; width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; }
  .guide-ring { position: absolute; width: 230px; height: 230px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.07); }
  .breath-ball { width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--ball-start), var(--ball-end)); box-shadow: 0 0 30px var(--glow-dim); will-change: transform, box-shadow; }

  .second-count { font-size: 2rem; font-weight: 200; color: var(--text-dim); min-height: 2.5rem; text-align: center; }

  .exercise-bottom { display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; }
  .progress-track { width: 100%; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }
  .cycle-label { font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.04em; }

  .action-btn { width: 100%; padding: 1rem; font-size: 1rem; font-weight: 500; border: none; border-radius: 0.85rem; cursor: pointer; letter-spacing: 0.03em; transition: opacity 0.2s; }
  .action-btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: var(--text); }

  #doneScreen { justify-content: center; align-items: center; gap: 2rem; min-height: 80dvh; }
  .done-check { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--accent); }
  .done-title { font-size: 1.3rem; font-weight: 500; }
  .done-stat { font-size: 0.85rem; color: var(--text-dim); text-align: center; line-height: 1.6; }
  .done-actions { display: flex; flex-direction: column; gap: 0.7rem; width: 100%; max-width: 300px; }

  .install-banner { display: none; position: fixed; bottom: calc(var(--safe-bottom) + 1rem); left: 1rem; right: 1rem; background: #1a2332; border: 1px solid rgba(128,203,196,0.2); border-radius: 1rem; padding: 1rem 1.2rem; z-index: 100; flex-direction: row; align-items: center; justify-content: space-between; gap: 0.8rem; }
  .install-banner.show { display: flex; }
  .install-text { font-size: 0.82rem; color: var(--text); flex: 1; }
  .install-btn { background: var(--accent); color: var(--bg); border: none; padding: 0.5rem 1rem; border-radius: 0.6rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .install-close { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; padding: 0.3rem; }
</style>
</head>
<body>

<div class="screen active" id="homeScreen">
  <div class="brand">
    <div class="brand-icon">🫁</div>
    <div class="brand-name">Respira</div>
    <div class="brand-sub">regulação pelo ritmo</div>
  </div>
  <div class="protocol-cards">
    <div class="protocol-card" data-protocol="equilibrio">
      <div class="left">
        <div class="title">4 × 4 — Equilíbrio</div>
        <div class="desc">4s inspira · 4s expira · 4 ciclos</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="protocol-card" data-protocol="ansiedade">
      <div class="left">
        <div class="title">2 × 4 — Anti-ansiedade</div>
        <div class="desc">2s inspira · 4s expira · 5 ciclos</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="protocol-card" data-protocol="suspiro">
      <div class="left">
        <div class="title">Suspiro Fisiológico</div>
        <div class="desc">2s inspira · 1s suspiro · 4s expira · 4 ciclos</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>
</div>

<div class="screen" id="exerciseScreen">
  <div class="top-bar">
    <button class="back-btn" id="backBtn">‹ Voltar</button>
    <div class="protocol-badge" id="protocolBadge"></div>
  </div>
  <div class="exercise-center">
    <div class="phase-text" id="phaseText">Toque para iniciar</div>
    <div class="ball-container">
      <div class="guide-ring"></div>
      <div class="breath-ball" id="ball"></div>
    </div>
    <div class="second-count" id="secondCount"></div>
  </div>
  <div class="exercise-bottom">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="cycle-label" id="cycleLabel"></div>
    <button class="action-btn btn-primary" id="startExercise">Iniciar</button>
  </div>
</div>

<div class="screen" id="doneScreen">
  <div class="done-check">✓</div>
  <div class="done-title">Prática concluída</div>
  <div class="done-stat" id="doneStat"></div>
  <div class="done-actions">
    <button class="action-btn btn-primary" id="repeatBtn">Repetir</button>
    <button class="action-btn btn-outline" id="homeBtn">Escolher outro</button>
  </div>
</div>

<div class="install-banner" id="installBanner">
  <div class="install-text">Instale o app na sua tela inicial</div>
  <button class="install-btn" id="installBtn">Instalar</button>
  <button class="install-close" id="installClose">×</button>
</div>

<script>
const PROTOCOLS = {
  equilibrio: {
    name: '4 × 4', subtitle: 'Equilíbrio', cycles: 4,
    phases: [
      { label: 'Inspire',  duration: 4, scaleFrom: 0, scaleTo: 1 },
      { label: 'Expire',   duration: 4, scaleFrom: 1, scaleTo: 0 }
    ]
  },
  ansiedade: {
    name: '2 × 4', subtitle: 'Anti-ansiedade', cycles: 5,
    phases: [
      { label: 'Inspire',  duration: 2, scaleFrom: 0, scaleTo: 0.5 },
      { label: 'Expire',   duration: 4, scaleFrom: 0.5, scaleTo: 0 }
    ]
  },
  suspiro: {
    name: 'Suspiro', subtitle: 'Fisiológico', cycles: 4,
    phases: [
      { label: 'Inspire',  duration: 2, scaleFrom: 0, scaleTo: 0.65 },
      { label: 'Suspiro',  duration: 1, scaleFrom: 0.65, scaleTo: 1 },
      { label: 'Expire',   duration: 4, scaleFrom: 1, scaleTo: 0 }
    ]
  }
};

let currentProtocol = null;
let running = false;
let animFrame = null;

const MIN_SCALE = 1;
const MAX_SCALE = 3.8;

const $ = id => document.getElementById(id);
const screens = document.querySelectorAll('.screen');
const ball = $('ball');
const phaseText = $('phaseText');
const secondCount = $('secondCount');
const progressFill = $('progressFill');
const cycleLabel = $('cycleLabel');

function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }
function lerp(a, b, t) { return a + (b - a) * t; }
function mapScale(norm) { return lerp(MIN_SCALE, MAX_SCALE, norm); }

function showScreen(id) {
  screens.forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.querySelectorAll('.protocol-card').forEach(card => {
  card.addEventListener('click', () => {
    currentProtocol = PROTOCOLS[card.dataset.protocol];
    resetExercise();
    showScreen('exerciseScreen');
    requestWakeLock();
  });
});

$('backBtn').addEventListener('click', () => { stopExercise(); showScreen('homeScreen'); });
$('repeatBtn').addEventListener('click', () => { resetExercise(); showScreen('exerciseScreen'); });
$('homeBtn').addEventListener('click', () => showScreen('homeScreen'));

function getCycleDuration(proto) {
  return proto.phases.reduce((sum, p) => sum + p.duration, 0);
}

function resetExercise() {
  stopExercise();
  const p = currentProtocol;
  $('protocolBadge').textContent = p.name + ' · ' + p.subtitle;
  phaseText.textContent = 'Toque para iniciar';
  phaseText.style.opacity = '0.6';
  secondCount.textContent = '';
  const cycleSec = getCycleDuration(p);
  cycleLabel.textContent = p.cycles + ' ciclos · ' + (p.cycles * cycleSec) + 's';
  progressFill.style.width = '0%';
  ball.style.transform = 'scale(' + MIN_SCALE + ')';
  ball.style.boxShadow = '0 0 30px var(--glow-dim)';
  $('startExercise').style.display = '';
  $('startExercise').textContent = 'Iniciar';
}

function stopExercise() {
  running = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = null;
}

$('startExercise').addEventListener('click', startExercise);

function startExercise() {
  if (running) return;
  running = true;
  $('startExercise').style.display = 'none';
  if (navigator.vibrate) navigator.vibrate(30);

  const p = currentProtocol;
  const cycleDur = getCycleDuration(p) * 1000;
  const totalDur = p.cycles * cycleDur;
  const startTime = performance.now();

  const phaseBounds = [];
  let cumulative = 0;
  for (const phase of p.phases) {
    phaseBounds.push({ label: phase.label, duration: phase.duration, scaleFrom: phase.scaleFrom, scaleTo: phase.scaleTo, startMs: cumulative, endMs: cumulative + phase.duration * 1000 });
    cumulative += phase.duration * 1000;
  }

  let lastPhaseLabel = '';

  function tick(now) {
    const elapsed = now - startTime;
    if (elapsed >= totalDur) { finishExercise(); return; }

    const cycleElapsed = elapsed % cycleDur;

    let activePhase = phaseBounds[0];
    for (const pb of phaseBounds) {
      if (cycleElapsed >= pb.startMs && cycleElapsed < pb.endMs) {
        activePhase = pb;
        break;
      }
    }

    const phaseProgress = (cycleElapsed - activePhase.startMs) / (activePhase.endMs - activePhase.startMs);
    const eased = easeInOutSine(phaseProgress);
    const normScale = lerp(activePhase.scaleFrom, activePhase.scaleTo, eased);
    const scale = mapScale(normScale);

    ball.style.transform = 'scale(' + scale + ')';

    const glowR = lerp(20, 70, normScale);
    const glowO = lerp(0.12, 0.4, normScale);
    ball.style.boxShadow = '0 0 ' + glowR + 'px rgba(79, 195, 247, ' + glowO + ')';

    phaseText.textContent = activePhase.label;
    phaseText.style.opacity = activePhase.label === 'Expire' ? '0.65' : '1';

    if (activePhase.label !== lastPhaseLabel) {
      if (navigator.vibrate) navigator.vibrate(15);
      lastPhaseLabel = activePhase.label;
    }

    const phaseRemaining = activePhase.endMs - cycleElapsed;
    secondCount.textContent = Math.ceil(phaseRemaining / 1000);

    const currentCycle = Math.floor(elapsed / cycleDur) + 1;
    cycleLabel.textContent = 'Ciclo ' + currentCycle + ' de ' + p.cycles;

    progressFill.style.width = ((elapsed / totalDur) * 100) + '%';

    animFrame = requestAnimationFrame(tick);
  }

  animFrame = requestAnimationFrame(tick);
}

function finishExercise() {
  running = false;
  ball.style.transform = 'scale(' + MIN_SCALE + ')';
  ball.style.boxShadow = '0 0 30px var(--glow-dim)';
  phaseText.textContent = '';
  secondCount.textContent = '';
  progressFill.style.width = '100%';

  const p = currentProtocol;
  const totalSecs = p.cycles * getCycleDuration(p);
  $('doneStat').textContent = p.name + ' · ' + p.subtitle + '\n' + p.cycles + ' ciclos · ' + totalSecs + ' segundos';

  if (navigator.vibrate) navigator.vibrate([30, 80, 30]);
  showScreen('doneScreen');
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('installBanner').classList.add('show');
});
$('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $('installBanner').classList.remove('show');
  }
});
$('installClose').addEventListener('click', () => $('installBanner').classList.remove('show'));

let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) requestWakeLock();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
