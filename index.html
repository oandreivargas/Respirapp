<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Respira 4×4">
<meta name="theme-color" content="#0a0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Exercício guiado de respiração 4×4 para regulação do sistema nervoso">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Respira 4×4</title>
<style>
  :root {
    --bg: #0a0f1a;
    --bg-card: rgba(255,255,255,0.04);
    --ball-start: #4fc3f7;
    --ball-end: #1565c0;
    --glow: rgba(79, 195, 247, 0.35);
    --glow-dim: rgba(21, 101, 192, 0.12);
    --text: #e0e6ed;
    --text-dim: #5a6e85;
    --accent: #80cbc4;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(var(--safe-top) + 1rem) 1.5rem calc(var(--safe-bottom) + 1rem);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ── TELA INICIAL ── */
  .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
  .screen.active { display: flex; }

  /* Home */
  #homeScreen { gap: 2.5rem; justify-content: center; min-height: 80dvh; }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }
  .brand-icon { font-size: 2.8rem; }
  .brand-name {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .brand-sub {
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .protocol-cards {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
  }

  .protocol-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.3rem;
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 1rem;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .protocol-card:active {
    background: rgba(255,255,255,0.08);
    border-color: rgba(128, 203, 196, 0.3);
  }
  .protocol-card .left { display: flex; flex-direction: column; gap: 0.15rem; }
  .protocol-card .title { font-size: 1.05rem; font-weight: 500; }
  .protocol-card .desc { font-size: 0.78rem; color: var(--text-dim); }
  .protocol-card .arrow { color: var(--text-dim); font-size: 1.2rem; }

  /* ── TELA DO EXERCÍCIO ── */
  #exerciseScreen {
    justify-content: space-between;
    min-height: 90dvh;
    padding-top: 1rem;
    padding-bottom: 1.5rem;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .protocol-badge {
    font-size: 0.78rem;
    color: var(--text-dim);
    background: var(--bg-card);
    padding: 0.35rem 0.8rem;
    border-radius: 1rem;
  }

  .exercise-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.8rem;
    flex: 1;
    justify-content: center;
  }

  .phase-text {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    min-height: 2rem;
    text-align: center;
    transition: opacity 0.3s;
  }

  .ball-container {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .guide-ring {
    position: absolute;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .breath-ball {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--ball-start), var(--ball-end));
    box-shadow: 0 0 30px var(--glow-dim);
    will-change: transform, box-shadow;
  }

  .second-count {
    font-size: 2rem;
    font-weight: 200;
    color: var(--text-dim);
    min-height: 2.5rem;
    text-align: center;
  }

  .exercise-bottom {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
  }

  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
  }

  .cycle-label {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .action-btn {
    width: 100%;
    padding: 1rem;
    font-size: 1rem;
    font-weight: 500;
    border: none;
    border-radius: 0.85rem;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
  }
  .action-btn:active { opacity: 0.8; }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-outline {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
  }

  /* ── TELA FINAL ── */
  #doneScreen {
    justify-content: center;
    align-items: center;
    gap: 2rem;
    min-height: 80dvh;
  }

  .done-icon { font-size: 3rem; }
  .done-title {
    font-size: 1.3rem;
    font-weight: 500;
  }
  .done-stat {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.6;
  }

  .done-actions {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    width: 100%;
    max-width: 300px;
  }

  /* Install banner */
  .install-banner {
    display: none;
    position: fixed;
    bottom: calc(var(--safe-bottom) + 1rem);
    left: 1rem;
    right: 1rem;
    background: #1a2332;
    border: 1px solid rgba(128,203,196,0.2);
    border-radius: 1rem;
    padding: 1rem 1.2rem;
    z-index: 100;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
  }
  .install-banner.show { display: flex; }
  .install-text { font-size: 0.82rem; color: var(--text); flex: 1; }
  .install-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 0.6rem;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .install-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.3rem;
  }
</style>
</head>
<body>

<!-- TELA INICIAL -->
<div class="screen active" id="homeScreen">
  <div class="brand">
    <div class="brand-icon">🫁</div>
    <div class="brand-name">Respira</div>
    <div class="brand-sub">regulação pelo ritmo</div>
  </div>

  <div class="protocol-cards">
    <div class="protocol-card" data-inhale="4" data-exhale="4" data-cycles="4" data-name="4 × 4">
      <div class="left">
        <div class="title">4 × 4 — Equilíbrio</div>
        <div class="desc">4s inspira · 4s expira · 4 ciclos</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="protocol-card" data-inhale="4" data-exhale="6" data-cycles="4" data-name="4 × 6">
      <div class="left">
        <div class="title">4 × 6 — Calma</div>
        <div class="desc">4s inspira · 6s expira · 4 ciclos</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="protocol-card" data-inhale="4" data-exhale="8" data-cycles="3" data-name="4 × 8">
      <div class="left">
        <div class="title">4 × 8 — Relaxamento</div>
        <div class="desc">4s inspira · 8s expira · 3 ciclos</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>
</div>

<!-- TELA DO EXERCÍCIO -->
<div class="screen" id="exerciseScreen">
  <div class="top-bar">
    <button class="back-btn" id="backBtn">‹ Voltar</button>
    <div class="protocol-badge" id="protocolBadge">4 × 4</div>
  </div>

  <div class="exercise-center">
    <div class="phase-text" id="phaseText">Toque para iniciar</div>
    <div class="ball-container">
      <div class="guide-ring"></div>
      <div class="breath-ball" id="ball"></div>
    </div>
    <div class="second-count" id="secondCount"></div>
  </div>

  <div class="exercise-bottom">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="cycle-label" id="cycleLabel"></div>
    <button class="action-btn btn-primary" id="startExercise">Iniciar</button>
  </div>
</div>

<!-- TELA FINAL -->
<div class="screen" id="doneScreen">
  <div class="done-icon">✓</div>
  <div class="done-title">Prática concluída</div>
  <div class="done-stat" id="doneStat"></div>
  <div class="done-actions">
    <button class="action-btn btn-primary" id="repeatBtn">Repetir</button>
    <button class="action-btn btn-outline" id="homeBtn">Escolher outro</button>
  </div>
</div>

<!-- INSTALL BANNER -->
<div class="install-banner" id="installBanner">
  <div class="install-text">Instale o app na sua tela inicial</div>
  <button class="install-btn" id="installBtn">Instalar</button>
  <button class="install-close" id="installClose">×</button>
</div>

<script>
  // ── STATE ──
  let config = { inhale: 4, exhale: 4, cycles: 4, name: '4 × 4' };
  let running = false;
  let animFrame = null;
  let startTime = 0;

  // ── ELEMENTS ──
  const $ = id => document.getElementById(id);
  const screens = document.querySelectorAll('.screen');
  const ball = $('ball');
  const phaseText = $('phaseText');
  const secondCount = $('secondCount');
  const progressFill = $('progressFill');
  const cycleLabel = $('cycleLabel');
  const protocolBadge = $('protocolBadge');
  const doneStat = $('doneStat');

  // ── NAVIGATION ──
  function showScreen(id) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // Protocol card selection
  document.querySelectorAll('.protocol-card').forEach(card => {
    card.addEventListener('click', () => {
      config.inhale = parseInt(card.dataset.inhale);
      config.exhale = parseInt(card.dataset.exhale);
      config.cycles = parseInt(card.dataset.cycles);
      config.name = card.dataset.name;
      resetExercise();
      showScreen('exerciseScreen');
    });
  });

  $('backBtn').addEventListener('click', () => {
    stopExercise();
    showScreen('homeScreen');
  });

  $('repeatBtn').addEventListener('click', () => {
    resetExercise();
    showScreen('exerciseScreen');
  });

  $('homeBtn').addEventListener('click', () => {
    showScreen('homeScreen');
  });

  // ── EXERCISE ──
  const MIN_SCALE = 1;
  const MAX_SCALE = 3.8;

  function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function resetExercise() {
    stopExercise();
    protocolBadge.textContent = config.name;
    phaseText.textContent = 'Toque para iniciar';
    phaseText.style.opacity = '0.6';
    secondCount.textContent = '';
    cycleLabel.textContent = `${config.cycles} ciclos · ${config.cycles * (config.inhale + config.exhale)}s`;
    progressFill.style.width = '0%';
    ball.style.transform = `scale(${MIN_SCALE})`;
    ball.style.boxShadow = '0 0 30px var(--glow-dim)';
    $('startExercise').style.display = '';
    $('startExercise').textContent = 'Iniciar';
  }

  function stopExercise() {
    running = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = null;
  }

  $('startExercise').addEventListener('click', startExercise);

  function startExercise() {
    if (running) return;
    running = true;
    $('startExercise').style.display = 'none';

    const cycleDur = (config.inhale + config.exhale) * 1000;
    const totalDur = config.cycles * cycleDur;
    startTime = performance.now();

    // Haptic feedback if available
    if (navigator.vibrate) navigator.vibrate(30);

    function tick(now) {
      const elapsed = now - startTime;

      if (elapsed >= totalDur) {
        finishExercise();
        return;
      }

      const cycleElapsed = elapsed % cycleDur;
      const inhaleDur = config.inhale * 1000;
      const exhaleDur = config.exhale * 1000;

      let phase, progress, secsLeft;

      if (cycleElapsed < inhaleDur) {
        phase = 'inhale';
        progress = cycleElapsed / inhaleDur;
        secsLeft = Math.ceil((inhaleDur - cycleElapsed) / 1000);
      } else {
        phase = 'exhale';
        const exElapsed = cycleElapsed - inhaleDur;
        progress = exElapsed / exhaleDur;
        secsLeft = Math.ceil((exhaleDur - exElapsed) / 1000);
      }

      const eased = easeInOutSine(progress);
      const scale = phase === 'inhale'
        ? lerp(MIN_SCALE, MAX_SCALE, eased)
        : lerp(MAX_SCALE, MIN_SCALE, eased);

      ball.style.transform = `scale(${scale})`;

      const normScale = (scale - MIN_SCALE) / (MAX_SCALE - MIN_SCALE);
      const glowR = lerp(20, 70, normScale);
      const glowO = lerp(0.12, 0.4, normScale);
      ball.style.boxShadow = `0 0 ${glowR}px rgba(79, 195, 247, ${glowO})`;

      phaseText.textContent = phase === 'inhale' ? 'Inspire' : 'Expire';
      phaseText.style.opacity = phase === 'inhale' ? '1' : '0.65';

      secondCount.textContent = secsLeft;

      const currentCycle = Math.floor(elapsed / cycleDur) + 1;
      cycleLabel.textContent = `Ciclo ${currentCycle} de ${config.cycles}`;

      progressFill.style.width = `${(elapsed / totalDur) * 100}%`;

      // Subtle vibration on phase change
      if (phase === 'inhale' && cycleElapsed < 50 && navigator.vibrate) {
        navigator.vibrate(15);
      }

      animFrame = requestAnimationFrame(tick);
    }

    animFrame = requestAnimationFrame(tick);
  }

  function finishExercise() {
    running = false;
    ball.style.transform = `scale(${MIN_SCALE})`;
    ball.style.boxShadow = '0 0 30px var(--glow-dim)';
    phaseText.textContent = '';
    secondCount.textContent = '';
    progressFill.style.width = '100%';

    const totalSecs = config.cycles * (config.inhale + config.exhale);
    doneStat.textContent = `${config.name} · ${config.cycles} ciclos · ${totalSecs} segundos`;

    if (navigator.vibrate) navigator.vibrate([30, 80, 30]);

    showScreen('doneScreen');
  }

  // ── PWA INSTALL ──
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $('installBanner').classList.add('show');
  });

  $('installBtn').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const result = await deferredPrompt.userChoice;
      deferredPrompt = null;
      $('installBanner').classList.remove('show');
    }
  });

  $('installClose').addEventListener('click', () => {
    $('installBanner').classList.remove('show');
  });

  // ── WAKE LOCK (keep screen on) ──
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      requestWakeLock();
    }
  });

  // Request wake lock when exercise starts
  const origStart = startExercise;
  // Already handled inline — wakeLock requested on card click
  document.querySelectorAll('.protocol-card').forEach(card => {
    card.addEventListener('click', requestWakeLock);
  });

  // ── SERVICE WORKER ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
